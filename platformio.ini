; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter, extra scripting
;   Upload options: custom port, speed and extra flags
;   Library options: dependencies, extra library storages
;
; Please visit documentation for the other options and examples
; http://docs.platformio.org/page/projectconf.html
[platformio]
src_dir = src

[env]
; Pinned official release: Arduino 3.2.0 / ESP-IDF 5.4.1.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
framework = arduino
upload_speed = 921600
monitor_speed = 115200
custom_component_remove =
  espressif/esp_hosted
  espressif/esp_wifi_remote
  espressif/esp-dsp
  espressif/esp32-camera
  espressif/libsodium
  espressif/esp-modbus
  espressif/qrcode
  espressif/esp_insights
  espressif/esp_diag_data_store
  espressif/esp_diagnostics
  espressif/esp_rainmaker
  espressif/rmaker_common
build_flags =
  -fno-exceptions
  ; -fno-rtti
  -Wall
  -Werror
  -lopus
  -lesp_audio_codec
  -lesp_audio_simple_dec
  -Os
  # debug
  ; -D PRINT_HEAP_INFO_INTERVAL=2000
  ; -D CLOGGER_SEVERITY=0

build_src_filter =
  +<**/*.c>
  +<**/*.cpp>
  -<**/*.S>
  -<**/*.asm>

[env:esp32_ai_bot]
board = esp32dev
board_build.mcu = esp32
build_src_filter =
  ${env.build_src_filter}
  +<../examples/esp32/ai_bot/*.c*>
build_flags =
  ${env.build_flags}
  -Lsrc/${this.board_build.mcu}
board_build.partitions = examples/esp32/ai_bot/partitions_4M.csv

[env:esp32_ai_bot_display_lcd]
board = esp32dev
board_build.mcu = esp32
build_src_filter =
  ${env.build_src_filter}
  +<../examples/esp32/ai_bot_display_lcd/*.c*>
build_flags =
  ${env.build_flags}
  -Lsrc/${this.board_build.mcu}
  -D LV_LVGL_H_INCLUDE_SIMPLE
  -I examples/esp32/ai_bot_display_lcd/
lib_deps = lvgl/lvgl@9.2.2
board_build.partitions = examples/esp32/ai_bot_display_lcd/partitions_4M.csv

